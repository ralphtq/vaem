name: Format trial

# Trial of QUDT's Spotless formatting on VAEM's sources. Formats src/**/*.ttl
# and the Markdown files with QUDT's settings in the runner's checkout only,
# checks that no triples changed, and attaches the formatted files and a diff
# to the run. Nothing is committed.
on:
  push:
    branches: [release-pipeline]
    paths:
      - "src/**"
      - "*.md"
      - ".github/workflows/format-trial.yml"

jobs:
  format-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib

      - name: Keep the unformatted files
        run: |
          mkdir -p ../before
          cp -r src ../before/src
          cp *.md ../before/

      - name: Write a Spotless-only pom.xml with QUDT's settings
        run: |
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.linkedmodel</groupId>
            <artifactId>vaem-format-trial</artifactId>
            <version>0</version>
            <build>
              <plugins>
                <plugin>
                  <groupId>com.diffplug.spotless</groupId>
                  <artifactId>spotless-maven-plugin</artifactId>
                  <version>3.9.0</version>
                  <configuration>
                    <rdf>
                      <includes><include>src/**/*.ttl</include></includes>
                      <format>
                        <failOnWarning>false</failOnWarning>
                        <verify>true</verify>
                        <turtleFormatterVersion>2.0.1</turtleFormatterVersion>
                        <turtle>
                          <preserveBlankNodeLabelsAndOrdering>false</preserveBlankNodeLabelsAndOrdering>
                          <predicateOrder>rdf:type,owl:imports</predicateOrder>
                          <firstPredicateInNewLine>true</firstPredicateInNewLine>
                        </turtle>
                      </format>
                    </rdf>
                    <markdown>
                      <includes>
                        <include>README.md</include>
                        <include>CHANGELOG.md</include>
                        <include>RELEASING.md</include>
                      </includes>
                      <flexmark />
                    </markdown>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          POM

      - name: Run spotless:apply
        run: mvn -B -ntp com.diffplug.spotless:spotless-maven-plugin:3.9.0:apply

      - name: Compare before and after
        run: |
          set -uo pipefail
          mkdir -p ../trial
          diff -ru ../before/src src > ../trial/format.diff || true
          for f in ../before/*.md; do diff -u "$f" "$(basename "$f")" >> ../trial/format.diff || true; done
          cp -r src ../trial/src-formatted
          cp *.md ../trial/
          python - <<'PY'
          import pathlib, rdflib
          from rdflib.compare import to_isomorphic
          lines = []
          for after in sorted(pathlib.Path("src").rglob("*.ttl")):
              before = pathlib.Path("../before") / after
              a = before.read_text(encoding="utf-8").splitlines()
              b = after.read_text(encoding="utf-8").splitlines()
              same = to_isomorphic(rdflib.Graph().parse(before)) == to_isomorphic(rdflib.Graph().parse(after))
              changed = sum(1 for x, y in zip(a, b) if x != y) + abs(len(a) - len(b))
              line = f"{after}: {len(a)} -> {len(b)} lines, about {changed} lines differ; triples {'unchanged' if same else 'CHANGED'}"
              lines.append(line)
              print(f"::notice title=Format trial::{line}")
          for md in ("README.md", "CHANGELOG.md", "RELEASING.md"):
              a = (pathlib.Path("../before") / md).read_text(encoding="utf-8")
              b = pathlib.Path(md).read_text(encoding="utf-8")
              line = f"{md}: {'unchanged' if a == b else 'reformatted'}"
              lines.append(line)
              print(f"::notice title=Format trial::{line}")
          pathlib.Path("../trial/SUMMARY.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Format trial\n\n" + "\n".join(f"- {l}" for l in lines) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vaem-format-trial
          path: ../trial/
